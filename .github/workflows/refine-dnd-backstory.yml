name: Refine DnD backstory reply guard

on:
  push:
    branches:
      - fix/dnd-backstory-reply-target

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Refine backstory concurrency guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AI/dnd.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '_task_supervisor = None\n_finalizing_polls = set()\n',
                  '_task_supervisor = None\n_finalizing_polls = set()\n_processing_backstories = set()\n',
              ),
              (
                  '    if not session or session.state != "WAITING_BACKSTORY":\n        return False\n',
                  '    if (\n'
                  '        not session\n'
                  '        or session.state != "WAITING_BACKSTORY"\n'
                  '        or message.chat.id in _processing_backstories\n'
                  '    ):\n'
                  '        return False\n',
              ),
              (
                  '    backstory_prompt_message_id = session.backstory_prompt_message_id\n'
                  '    session.state = "RESOLVING"\n'
                  '    session.backstory_prompt_message_id = None\n'
                  '    persist_dnd_sessions()\n'
                  '    try:\n',
                  '    backstory_prompt_message_id = session.backstory_prompt_message_id\n'
                  '    _processing_backstories.add(message.chat.id)\n'
                  '    try:\n',
              ),
              (
                  '        except Exception:\n'
                  '            pass\n'
                  '        await parse_and_execute_turn(message.bot, message.chat.id, response_text)\n',
                  '        except Exception:\n'
                  '            pass\n'
                  '        session.backstory_prompt_message_id = None\n'
                  '        persist_dnd_sessions()\n'
                  '        await parse_and_execute_turn(message.bot, message.chat.id, response_text)\n',
              ),
              (
                  '        await message.answer("Мастер завис, но история сохранена. Попробуй ещё раз реплаем.")\n\n\n@dnd_router.message(F.text.lower().contains("кидаю"))\n',
                  '        await message.answer("Мастер завис, но история сохранена. Попробуй ещё раз реплаем.")\n'
                  '    finally:\n'
                  '        _processing_backstories.discard(message.chat.id)\n'
                  '\n\n'
                  '@dnd_router.message(F.text.lower().contains("кидаю"))\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_dnd_backstory_reply.py <<'PY'
          import asyncio
          from types import SimpleNamespace

          from tests import test_smoke_imports

          del test_smoke_imports

          from AI import dnd


          class FakeBot:
              def __init__(self):
                  self.deleted = []

              async def delete_message(self, chat_id, message_id):
                  self.deleted.append((chat_id, message_id))


          class FakeMessage:
              def __init__(self, *, chat_id, text, reply_to_message_id=None):
                  self.chat = SimpleNamespace(id=chat_id)
                  self.text = text
                  self.caption = None
                  self.from_user = SimpleNamespace(id=1, first_name="Игрок")
                  self.reply_to_message = (
                      SimpleNamespace(message_id=reply_to_message_id)
                      if reply_to_message_id is not None
                      else None
                  )
                  self.bot = FakeBot()
                  self.answers = []

              async def answer(self, text, **kwargs):
                  self.answers.append((text, kwargs))
                  return SimpleNamespace(message_id=100 + len(self.answers))


          def test_backstory_router_only_accepts_reply_to_current_prompt():
              chat_id = -100601
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=77,
              )
              dnd.dnd_sessions[chat_id] = session
              try:
                  plain = FakeMessage(chat_id=chat_id, text="слегка")
                  wrong_reply = FakeMessage(
                      chat_id=chat_id,
                      text="слегка",
                      reply_to_message_id=76,
                  )
                  correct_reply = FakeMessage(
                      chat_id=chat_id,
                      text="слегка",
                      reply_to_message_id=77,
                  )

                  assert dnd._is_backstory_reply(plain) is False
                  assert dnd._is_backstory_reply(wrong_reply) is False
                  assert dnd._is_backstory_reply(correct_reply) is True

                  dnd._processing_backstories.add(chat_id)
                  try:
                      assert dnd._is_backstory_reply(correct_reply) is False
                  finally:
                      dnd._processing_backstories.discard(chat_id)
              finally:
                  dnd.dnd_sessions.pop(chat_id, None)


          def test_backstory_is_claimed_in_memory_during_generation(monkeypatch):
              chat_id = -100602
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=88,
              )
              dnd.dnd_sessions[chat_id] = session
              monkeypatch.setattr(dnd, "persist_dnd_sessions", lambda: None)
              monkeypatch.setattr(dnd, "with_scene_direction", lambda _session, prompt: prompt)

              observed_states = []

              async def fake_generate(current_session, _prompt):
                  observed_states.append(
                      (
                          current_session.state,
                          current_session.backstory_prompt_message_id,
                          chat_id in dnd._processing_backstories,
                      )
                  )
                  return "Сцена [ACTION:INPUT]"

              async def fake_parse(_bot, _chat_id, _text):
                  return None

              monkeypatch.setattr(dnd, "generate_session_response", fake_generate)
              monkeypatch.setattr(dnd, "parse_and_execute_turn", fake_parse)

              try:
                  message = FakeMessage(
                      chat_id=chat_id,
                      text="Я проснулся в подвале",
                      reply_to_message_id=88,
                  )
                  asyncio.run(dnd.handle_backstory(message))
                  assert observed_states == [("WAITING_BACKSTORY", 88, True)]
                  assert session.backstory_prompt_message_id is None
                  assert chat_id not in dnd._processing_backstories
              finally:
                  dnd._processing_backstories.discard(chat_id)
                  dnd.dnd_sessions.pop(chat_id, None)


          def test_backstory_failure_reopens_same_prompt(monkeypatch):
              chat_id = -100603
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=99,
              )
              dnd.dnd_sessions[chat_id] = session
              monkeypatch.setattr(dnd, "persist_dnd_sessions", lambda: None)
              monkeypatch.setattr(dnd, "with_scene_direction", lambda _session, prompt: prompt)

              async def fail_generate(_session, _prompt):
                  raise RuntimeError("boom")

              monkeypatch.setattr(dnd, "generate_session_response", fail_generate)

              try:
                  message = FakeMessage(
                      chat_id=chat_id,
                      text="Предыстория",
                      reply_to_message_id=99,
                  )
                  asyncio.run(dnd.handle_backstory(message))
                  assert session.state == "WAITING_BACKSTORY"
                  assert session.backstory_prompt_message_id == 99
                  assert chat_id not in dnd._processing_backstories
              finally:
                  dnd._processing_backstories.discard(chat_id)
                  dnd.dnd_sessions.pop(chat_id, None)
          PY

      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run targeted tests
        run: python -m pytest tests/test_dnd_backstory_reply.py tests/test_dnd_turns.py -q
      - name: Commit refinement
        shell: bash
        run: |
          git rm .github/workflows/refine-dnd-backstory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI/dnd.py tests/test_dnd_backstory_reply.py
          git commit -m "Harden DnD backstory concurrency handling"
          git push origin HEAD:fix/dnd-backstory-reply-target
