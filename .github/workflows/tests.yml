name: Tests

on:
  push:
    branches: [refactor]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run static checks
        run: |
          python -m pyflakes \
            main.py \
            app \
            core \
            infrastructure \
            AI/dnd_completion.py \
            AI/dnd_runtime.py \
            games/crocodile_persistence.py \
            games/crocodile_party_state.py \
            games/crocodile_runtime.py \
            scripts/backup_runtime_state.py \
            scripts/restore_history_journal.py \
            scripts/production_healthcheck.py \
            scripts/export_rank_counters.py \
            scripts/prepare_history_rollback.py \
            scripts/index_history.py \
            tests/test_application_bootstrap.py \
            tests/test_application_lifecycle.py \
            tests/test_configuration_composition.py \
            tests/test_dependency_versions.py \
            tests/test_dynamic_task_ownership.py \
            tests/test_architecture_guardrails.py \
            tests/test_production_hardening.py \
            tests/test_portability_regressions.py \
            tests/test_dnd_completion_policy.py \
            tests/test_dnd_runtime.py \
            tests/test_crocodile_party_resilience.py \
            tests/test_crocodile_runtime.py
      - name: Run tests with coverage
        run: >-
          python -m pytest tests/ -q
          --cov=app --cov=AI --cov=core --cov=infrastructure
          --cov=features --cov=games --cov=handlers --cov=services --cov=prompts
          --cov-report=term-missing
          --cov-fail-under=30
      - name: Verify tests did not write Crocodile party state to repo root
        run: test ! -e crocodile_party_state.json

  portability-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run Windows portability regressions
        run: >-
          python -m pytest
          tests/test_portability_regressions.py
          tests/test_song.py
          tests/test_backup_retention.py
          tests/test_social_graph_picture_labels.py
          tests/test_crocodile_session_persistence.py
          tests/test_crocodile_party_resilience.py
          tests/test_crocodile_runtime.py
          -q
      - name: Verify Windows tests did not write Crocodile party state to repo root
        run: python -c "from pathlib import Path; assert not Path('crocodile_party_state.json').exists()"
