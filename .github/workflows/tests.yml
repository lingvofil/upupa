name: Tests

on:
  push:
    branches: [refactor]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run static checks
        run: python scripts/run_pyflakes.py
      - name: Run integration smoke
        run: >-
          python -m pytest
          tests/test_leveltravel_integration.py
          tests/test_tutu_integration.py
          -q
      - name: Run tests with coverage
        run: >-
          python -m pytest tests/ -q
          --cov=app --cov=AI --cov=core --cov=infrastructure
          --cov=features --cov=games --cov=handlers --cov=services --cov=prompts
          --cov-report=term-missing
          --cov-fail-under=30
      - name: Verify tests did not write Crocodile party state to repo root
        run: test ! -e crocodile_party_state.json

  miniapp-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Run Crocodile Mini App browser smoke
        run: python scripts/crocodile_browser_smoke.py

  portability-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run Windows portability regressions
        run: >-
          python -m pytest
          tests/test_portability_regressions.py
          tests/test_song.py
          tests/test_backup_retention.py
          tests/test_social_graph_picture_labels.py
          tests/test_crocodile_session_persistence.py
          tests/test_crocodile_party_resilience.py
          tests/test_crocodile_duo_optin.py
          tests/test_crocodile_duo_menu.py
          tests/test_crocodile_controls_keyboard_composition.py
          tests/test_crocodile_runtime.py
          tests/test_crocodile_check_answer_composition.py
          -q
      - name: Verify Windows tests did not write Crocodile party state to repo root
        run: python -c "from pathlib import Path; assert not Path('crocodile_party_state.json').exists()"
