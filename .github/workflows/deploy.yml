name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: upupa-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '88.218.122.208' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR || '/root/upupa' }}
      DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE || 'upupa_bot.service' }}
      DEPLOY_KEY_PATH: /tmp/upupa_deploy_key_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Configure SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${SSH_PRIVATE_KEY}" ]]; then
            echo "::error::SSH_PRIVATE_KEY is not configured"
            exit 1
          fi

          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${DEPLOY_KEY_PATH}"
          chmod 600 "${DEPLOY_KEY_PATH}"
          echo "::warning::SSH host-key verification is disabled for deployment"

      - name: Deploy exact commit with backup, healthcheck and rollback
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${DEPLOY_APP_DIR}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "${DEPLOY_SERVICE}" =~ ^[A-Za-z0-9_.@-]+$ ]]
          [[ -f "${DEPLOY_KEY_PATH}" ]]

          SSH_OPTIONS=(
            -i "${DEPLOY_KEY_PATH}"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )

          echo "Deploying ${DEPLOY_SHA} to ${DEPLOY_USER}@${DEPLOY_HOST}..."
          ssh "${SSH_OPTIONS[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s -- '${DEPLOY_SHA}' '${DEPLOY_APP_DIR}' '${DEPLOY_SERVICE}'" <<'REMOTE'
          set -Eeuo pipefail

          TARGET_SHA="$1"
          APP_DIR="$2"
          SERVICE="$3"
          VENV_PYTHON="$APP_DIR/venv/bin/python"
          BACKUP_ROOT="$(dirname "$APP_DIR")/upupa-backups"
          PREVIOUS_SHA=""
          BACKUP_DIR=""
          CODE_SWITCHED=0
          DEPLOY_SUCCEEDED=0
          MIN_BOOTSTRAP_FREE_KB=$((512 * 1024))

          service_ctl() {
            if [[ "$(id -u)" -eq 0 ]]; then
              systemctl "$@"
            else
              sudo -n systemctl "$@"
            fi
          }

          bootstrap_prune_backups() {
            # This runs before any Git operation that may need to create lock
            # files or fetch objects. It only touches deploy backup directories
            # created by scripts/backup_runtime_state.py and always preserves
            # the newest completed known-good snapshot.
            [[ -d "$BACKUP_ROOT" ]] || return 0

            local dir name available_kb index
            local -a completed=()
            for dir in "$BACKUP_ROOT"/*; do
              [[ -d "$dir" ]] || continue
              name="${dir##*/}"
              [[ "$name" =~ ^[0-9]{8}T[0-9]{6}\.[0-9]{6}Z-[A-Za-z0-9._-]+$ ]] || continue
              if [[ -f "$dir/manifest.json" ]]; then
                completed+=("$dir")
              else
                echo "Removing incomplete deploy backup ${dir}" >&2
                rm -rf -- "$dir"
              fi
            done

            available_kb="$(df -Pk "$APP_DIR" | awk 'NR==2 {print $4}')"
            [[ "$available_kb" =~ ^[0-9]+$ ]] || return 0
            if (( available_kb >= MIN_BOOTSTRAP_FREE_KB )); then
              return 0
            fi

            if (( ${#completed[@]} <= 1 )); then
              echo "Low disk before deploy: ${available_kb} KiB free; preserving the last known-good backup" >&2
              return 0
            fi

            mapfile -t completed < <(printf '%s\n' "${completed[@]}" | sort)
            for ((index=0; index<${#completed[@]}-1; index++)); do
              echo "Low disk before git fetch; removing old deploy backup ${completed[$index]}" >&2
              rm -rf -- "${completed[$index]}"
              available_kb="$(df -Pk "$APP_DIR" | awk 'NR==2 {print $4}')"
              [[ "$available_kb" =~ ^[0-9]+$ ]] || break
              if (( available_kb >= MIN_BOOTSTRAP_FREE_KB )); then
                break
              fi
            done
            echo "Deploy bootstrap disk free: ${available_kb} KiB" >&2
          }

          run_healthcheck() {
            local script="$1"
            local attempt
            local service_pid
            # First successful long poll can take 30 seconds in an idle chat.
            for attempt in {1..12}; do
              service_pid="$(service_ctl show --property MainPID --value "$SERVICE")" || return 1
              if service_ctl is-active --quiet "$SERVICE" &&
                 [[ "$service_pid" =~ ^[1-9][0-9]*$ ]] &&
                 UPUPA_EXPECTED_PID="$service_pid" "$VENV_PYTHON" "$script" --app-dir "$APP_DIR" --timeout 10; then
                return 0
              fi
              echo "Healthcheck attempt ${attempt}/12 failed" >&2
              sleep 5
            done
            return 1
          }

          rollback() {
            local status=$?
            trap - ERR
            if [[ "$DEPLOY_SUCCEEDED" -eq 1 ]]; then
              return "$status"
            fi
            if [[ "$CODE_SWITCHED" -eq 0 ]]; then
              echo "Deploy preflight failed before code switch; production was not changed." >&2
              exit "$status"
            fi

            echo "Deployment failed; rolling back to ${PREVIOUS_SHA}..." >&2
            if [[ -n "$BACKUP_DIR" ]]; then
              echo "Pre-deploy backup retained at ${BACKUP_DIR}" >&2
            fi

            if ! git cat-file -e "${PREVIOUS_SHA}:infrastructure/persistence/sqlite_history.py" 2>/dev/null; then
              service_ctl stop "$SERVICE"
              "$VENV_PYTHON" "$APP_DIR/scripts/prepare_history_rollback.py" --app-dir "$APP_DIR"
            fi
            if ! git cat-file -e "${PREVIOUS_SHA}:infrastructure/persistence/sqlite_rank_counters.py" 2>/dev/null; then
              service_ctl stop "$SERVICE"
              "$VENV_PYTHON" "$APP_DIR/scripts/export_rank_counters.py" --app-dir "$APP_DIR"
            fi

            set +e
            git reset --hard "$PREVIOUS_SHA"
            "$VENV_PYTHON" -m pip install \
              --disable-pip-version-check -r requirements.txt
            service_ctl restart "$SERVICE"
            sleep 5
            # Use the restored revision's contract, including legacy getMe-only
            # healthchecks when rolling back the first readiness deployment.
            run_healthcheck "$APP_DIR/scripts/production_healthcheck.py"
            local rollback_status=$?
            set -e

            if [[ "$rollback_status" -ne 0 ]]; then
              echo "Rollback completed but functional healthcheck failed." >&2
            else
              echo "Rollback succeeded; service and Telegram getMe are healthy." >&2
            fi
            exit "$status"
          }
          trap rollback ERR

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_DIR" == /* ]]
          [[ -d "$APP_DIR/.git" ]]
          [[ -x "$VENV_PYTHON" ]]

          cd "$APP_DIR"
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          bootstrap_prune_backups
          # Do not mutate .git/config in a disk-full recovery path. Fetch from
          # the canonical URL directly; the server already has GitHub SSH auth.
          git fetch --prune git@github.com:lingvofil/upupa.git main
          git cat-file -e "${TARGET_SHA}^{commit}"

          DEPLOY_TMP_DIR="$(mktemp -d /tmp/upupa-deploy.XXXXXX)"
          BACKUP_SCRIPT="$DEPLOY_TMP_DIR/backup_runtime_state.py"
          HEALTHCHECK_SCRIPT="$DEPLOY_TMP_DIR/production_healthcheck.py"
          HISTORY_INDEX_SCRIPT="$DEPLOY_TMP_DIR/index_history.py"
          HISTORY_INDEX_MODULE="$DEPLOY_TMP_DIR/sqlite_history.py"
          git show "${TARGET_SHA}:scripts/backup_runtime_state.py" > "$BACKUP_SCRIPT"
          git show "${TARGET_SHA}:scripts/production_healthcheck.py" > "$HEALTHCHECK_SCRIPT"
          git show "${TARGET_SHA}:scripts/index_history.py" > "$HISTORY_INDEX_SCRIPT"
          git show "${TARGET_SHA}:infrastructure/persistence/sqlite_history.py" > "$HISTORY_INDEX_MODULE"

          BACKUP_DIR="$(
            "$VENV_PYTHON" "$BACKUP_SCRIPT" \
              --source "$APP_DIR" \
              --destination "$BACKUP_ROOT" \
              --label "$TARGET_SHA"
          )"
          [[ -d "$BACKUP_DIR" ]]
          [[ -f "$BACKUP_DIR/manifest.json" ]]
          echo "Runtime backup created at ${BACKUP_DIR}"

          # Stdlib-only target adapter: build the derived index while the old
          # bot is still serving. Interrupted imports resume from checkpoints.
          "$VENV_PYTHON" "$HISTORY_INDEX_SCRIPT" --app-dir "$APP_DIR" \
            --repository-module "$HISTORY_INDEX_MODULE"

          git reset --hard "$TARGET_SHA"
          CODE_SWITCHED=1

          "$VENV_PYTHON" -m pip install \
            --disable-pip-version-check -r requirements.txt
          service_ctl restart "$SERVICE"
          sleep 5
          run_healthcheck "$HEALTHCHECK_SCRIPT"

          DEPLOY_SUCCEEDED=1
          trap - ERR
          echo "Deployment ${TARGET_SHA} succeeded; service and Telegram getMe are healthy."
          REMOTE

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "${DEPLOY_KEY_PATH}"
