name: Apply DnD completion policy refactor

on:
  push:
    branches:
      - refactor/dnd-completion-explicit-policy

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/dnd-completion-explicit-policy
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply refactor
        run: python scripts/_refactor_dnd_completion_policy.py
      - name: Validate syntax and diff
        run: |
          python -m py_compile AI/dnd_completion.py AI/dnd_campaign.py AI/dnd_combat.py
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refactor-dnd-completion-policy.yml scripts/_refactor_dnd_completion_policy.py
          git add AI/dnd_completion.py AI/dnd_campaign.py AI/dnd_combat.py
          git commit -m 'refactor: replace DnD completion monkeypatches with policy hooks'
          git push origin HEAD:refactor/dnd-completion-explicit-policy
