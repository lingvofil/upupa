name: Patch DnD backstory reply guard

on:
  push:
    branches:
      - fix/dnd-backstory-reply-target

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Patch DnD backstory handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AI/dnd.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '        self.state = "WAITING_BACKSTORY"\n        self.last_roll_stat = None\n',
                  '        self.state = "WAITING_BACKSTORY"\n        self.backstory_prompt_message_id = None\n        self.last_roll_stat = None\n',
              ),
              (
                  '            "state": self.state,\n            "last_roll_stat": self.last_roll_stat,\n',
                  '            "state": self.state,\n            "backstory_prompt_message_id": self.backstory_prompt_message_id,\n            "last_roll_stat": self.last_roll_stat,\n',
              ),
              (
                  '        session.state = record.get("state") or "WAITING_ACTION"\n        session.last_roll_stat = record.get("last_roll_stat")\n',
                  '        session.state = record.get("state") or "WAITING_ACTION"\n        session.backstory_prompt_message_id = record.get("backstory_prompt_message_id")\n        session.last_roll_stat = record.get("last_roll_stat")\n',
              ),
              (
                  'async def _restore_action_prompt(bot: Bot, chat_id: int):\n',
                  'async def _restore_backstory_prompt(bot: Bot, chat_id: int):\n'
                  '    session = dnd_sessions.get(chat_id)\n'
                  '    if not session or session.state != "WAITING_BACKSTORY":\n'
                  '        return\n'
                  '    if getattr(session, "backstory_prompt_message_id", None):\n'
                  '        return\n'
                  '    prompt_message = await bot.send_message(\n'
                  '        chat_id,\n'
                  '        "Какую предысторию хочешь? (Ответь реплаем)",\n'
                  '    )\n'
                  '    session.backstory_prompt_message_id = prompt_message.message_id\n'
                  '    persist_dnd_sessions()\n'
                  '\n\n'
                  'async def _restore_action_prompt(bot: Bot, chat_id: int):\n',
              ),
              (
                  '            if session.state == "WAITING_ACTION":\n',
                  '            if (\n'
                  '                session.state == "WAITING_BACKSTORY"\n'
                  '                and not getattr(session, "backstory_prompt_message_id", None)\n'
                  '            ):\n'
                  '                _start_background_task(\n'
                  '                    _restore_backstory_prompt(bot, session.chat_id),\n'
                  '                    name=f"dnd-backstory:{session.chat_id}:restore-prompt",\n'
                  '                )\n'
                  '\n'
                  '            if session.state == "WAITING_ACTION":\n',
              ),
              (
                  '    await message.answer(f"Ладно, {user_name}. Какую предысторию хочешь? (Ответь реплаем)")\n',
                  '    prompt_message = await message.answer(\n'
                  '        f"Ладно, {user_name}. Какую предысторию хочешь? (Ответь реплаем)"\n'
                  '    )\n'
                  '    session.backstory_prompt_message_id = prompt_message.message_id\n'
                  '    persist_dnd_sessions()\n',
              ),
              (
                  '@dnd_router.message(\n'
                  '    lambda m: m.reply_to_message\n'
                  '    and dnd_sessions.get(m.chat.id)\n'
                  '    and dnd_sessions[m.chat.id].state == "WAITING_BACKSTORY"\n'
                  ')\n'
                  'async def handle_backstory(message: Message):\n',
                  'def _is_backstory_reply(message: Message) -> bool:\n'
                  '    session = dnd_sessions.get(message.chat.id)\n'
                  '    if not session or session.state != "WAITING_BACKSTORY":\n'
                  '        return False\n'
                  '    prompt_message_id = getattr(session, "backstory_prompt_message_id", None)\n'
                  '    if not prompt_message_id or not message.reply_to_message:\n'
                  '        return False\n'
                  '    return int(message.reply_to_message.message_id) == int(prompt_message_id)\n'
                  '\n\n'
                  '@dnd_router.message(_is_backstory_reply)\n'
                  'async def handle_backstory(message: Message):\n',
              ),
              (
                  '    msg = await message.answer("Генерирую...")\n    try:\n',
                  '    backstory_prompt_message_id = session.backstory_prompt_message_id\n'
                  '    session.state = "RESOLVING"\n'
                  '    session.backstory_prompt_message_id = None\n'
                  '    persist_dnd_sessions()\n'
                  '    try:\n'
                  '        msg = await message.answer("Генерирую...")\n',
              ),
              (
                  '    except Exception:\n'
                  '        logging.exception("DnD backstory generation failed chat_id=%s", message.chat.id)\n'
                  '        await message.answer("Мастер завис, но история сохранена. Попробуй ещё раз реплаем.")\n',
                  '    except Exception:\n'
                  '        logging.exception("DnD backstory generation failed chat_id=%s", message.chat.id)\n'
                  '        if dnd_sessions.get(message.chat.id) is session:\n'
                  '            session.state = "WAITING_BACKSTORY"\n'
                  '            session.backstory_prompt_message_id = backstory_prompt_message_id\n'
                  '            persist_dnd_sessions()\n'
                  '        await message.answer("Мастер завис, но история сохранена. Попробуй ещё раз реплаем.")\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_dnd_backstory_reply.py <<'PY'
          import asyncio
          from types import SimpleNamespace

          from tests import test_smoke_imports

          del test_smoke_imports

          from AI import dnd


          class FakeBot:
              def __init__(self):
                  self.deleted = []

              async def delete_message(self, chat_id, message_id):
                  self.deleted.append((chat_id, message_id))


          class FakeMessage:
              def __init__(self, *, chat_id, text, reply_to_message_id=None):
                  self.chat = SimpleNamespace(id=chat_id)
                  self.text = text
                  self.caption = None
                  self.from_user = SimpleNamespace(id=1, first_name="Игрок")
                  self.reply_to_message = (
                      SimpleNamespace(message_id=reply_to_message_id)
                      if reply_to_message_id is not None
                      else None
                  )
                  self.bot = FakeBot()
                  self.answers = []

              async def answer(self, text, **kwargs):
                  self.answers.append((text, kwargs))
                  return SimpleNamespace(message_id=100 + len(self.answers))


          def test_backstory_router_only_accepts_reply_to_current_prompt():
              chat_id = -100601
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=77,
              )
              dnd.dnd_sessions[chat_id] = session
              try:
                  plain = FakeMessage(chat_id=chat_id, text="слегка")
                  wrong_reply = FakeMessage(
                      chat_id=chat_id,
                      text="слегка",
                      reply_to_message_id=76,
                  )
                  correct_reply = FakeMessage(
                      chat_id=chat_id,
                      text="слегка",
                      reply_to_message_id=77,
                  )

                  assert dnd._is_backstory_reply(plain) is False
                  assert dnd._is_backstory_reply(wrong_reply) is False
                  assert dnd._is_backstory_reply(correct_reply) is True
              finally:
                  dnd.dnd_sessions.pop(chat_id, None)


          def test_backstory_is_claimed_before_generation(monkeypatch):
              chat_id = -100602
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=88,
              )
              dnd.dnd_sessions[chat_id] = session
              monkeypatch.setattr(dnd, "persist_dnd_sessions", lambda: None)
              monkeypatch.setattr(dnd, "with_scene_direction", lambda _session, prompt: prompt)

              observed_states = []

              async def fake_generate(current_session, _prompt):
                  observed_states.append(
                      (current_session.state, current_session.backstory_prompt_message_id)
                  )
                  return "Сцена [ACTION:INPUT]"

              async def fake_parse(_bot, _chat_id, _text):
                  return None

              monkeypatch.setattr(dnd, "generate_session_response", fake_generate)
              monkeypatch.setattr(dnd, "parse_and_execute_turn", fake_parse)

              try:
                  message = FakeMessage(
                      chat_id=chat_id,
                      text="Я проснулся в подвале",
                      reply_to_message_id=88,
                  )
                  asyncio.run(dnd.handle_backstory(message))
              finally:
                  dnd.dnd_sessions.pop(chat_id, None)

              assert observed_states == [("RESOLVING", None)]


          def test_backstory_failure_reopens_same_prompt(monkeypatch):
              chat_id = -100603
              session = SimpleNamespace(
                  state="WAITING_BACKSTORY",
                  backstory_prompt_message_id=99,
              )
              dnd.dnd_sessions[chat_id] = session
              monkeypatch.setattr(dnd, "persist_dnd_sessions", lambda: None)
              monkeypatch.setattr(dnd, "with_scene_direction", lambda _session, prompt: prompt)

              async def fail_generate(_session, _prompt):
                  raise RuntimeError("boom")

              monkeypatch.setattr(dnd, "generate_session_response", fail_generate)

              try:
                  message = FakeMessage(
                      chat_id=chat_id,
                      text="Предыстория",
                      reply_to_message_id=99,
                  )
                  asyncio.run(dnd.handle_backstory(message))
                  assert session.state == "WAITING_BACKSTORY"
                  assert session.backstory_prompt_message_id == 99
              finally:
                  dnd.dnd_sessions.pop(chat_id, None)
          PY

      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run targeted tests
        run: python -m pytest tests/test_dnd_backstory_reply.py tests/test_dnd_turns.py -q
      - name: Commit patch
        shell: bash
        run: |
          git rm .github/workflows/fix-dnd-backstory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI/dnd.py tests/test_dnd_backstory_reply.py
          git commit -m "Fix DnD backstory reply routing"
          git push origin HEAD:fix/dnd-backstory-reply-target
