<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crocodile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: fixed;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      flex: 1;
      min-height: 0;
      background: #fff;
      display: block;
      touch-action: none;
      width: 100%;
      height: auto;
      transform-origin: 0 0;
      will-change: transform;
      position: relative;
      z-index: 1;
    }
    .toolbar {
      min-height: 78px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      touch-action: auto;
      position: relative;
      z-index: 2;
    }
    .btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      color: white;
      cursor: pointer;
      white-space: nowrap;
      touch-action: auto;
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .btn-red { background: #ff3b30; }
    .btn-gray { background: #555; }
    .btn.active {
      background: #fff;
      color: #222;
      outline: 2px solid rgba(255,255,255,0.4);
    }

    .palette {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1 1 360px;
      min-width: 0;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.6);
      padding: 0;
      touch-action: auto;
      flex: 0 0 auto;
    }
    .swatch.active {
      border: 2px solid #fff;
      outline: 2px solid rgba(0,0,0,0.35);
    }
    .picker {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      padding: 0;
      background: transparent;
      touch-action: auto;
      flex: 0 0 auto;
    }
    .tools,
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 0 0 auto;
    }
    .tools {
      flex-wrap: wrap;
    }
    .actions {
      margin-left: auto;
    }
    .size-control {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 6px 9px;
      border-radius: 10px;
      background: #444;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      touch-action: auto;
    }
    .size-control input[type="range"] {
      width: 110px;
      touch-action: auto;
    }
    .size-value {
      min-width: 38px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      .palette {
        flex-basis: 100%;
      }
      .tools {
        flex: 1 1 auto;
      }
      .size-control input[type="range"] {
        width: min(30vw, 110px);
      }
      .actions {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar" class="toolbar">
  <div class="palette" id="palette">
    <button class="swatch active" type="button" data-c="#000000" style="background:#000000" aria-label="Чёрный"></button>
    <button class="swatch" type="button" data-c="#ffffff" style="background:#ffffff" aria-label="Белый"></button>
    <button class="swatch" type="button" data-c="#ff3b30" style="background:#ff3b30" aria-label="Красный"></button>
    <button class="swatch" type="button" data-c="#ff9500" style="background:#ff9500" aria-label="Оранжевый"></button>
    <button class="swatch" type="button" data-c="#ffcc00" style="background:#ffcc00" aria-label="Жёлтый"></button>
    <button class="swatch" type="button" data-c="#34c759" style="background:#34c759" aria-label="Зелёный"></button>
    <button class="swatch" type="button" data-c="#007aff" style="background:#007aff" aria-label="Синий"></button>
    <button class="swatch" type="button" data-c="#5856d6" style="background:#5856d6" aria-label="Индиго"></button>
    <button class="swatch" type="button" data-c="#af52de" style="background:#af52de" aria-label="Фиолетовый"></button>
    <button class="swatch" type="button" data-c="#00c7be" style="background:#00c7be" aria-label="Бирюзовый"></button>
    <button class="swatch" type="button" data-c="#64d2ff" style="background:#64d2ff" aria-label="Голубой"></button>
    <button class="swatch" type="button" data-c="#8e8e93" style="background:#8e8e93" aria-label="Серый"></button>
    <button class="swatch" type="button" data-c="#a2845e" style="background:#a2845e" aria-label="Коричневый"></button>
    <button class="swatch" type="button" data-c="#ff2d55" style="background:#ff2d55" aria-label="Розовый"></button>
    <input id="colorPicker" type="color" class="picker" value="#000000" aria-label="Другой цвет" />
  </div>

  <div class="tools">
    <button id="eraserButton" class="btn btn-gray" type="button" aria-pressed="false">⌫ Ластик</button>
    <label class="size-control" for="brushSize">
      Кисть
      <input id="brushSize" type="range" min="2" max="28" step="1" value="6" aria-label="Толщина кисти" />
      <span id="brushSizeValue" class="size-value">6</span>
    </label>
    <label class="size-control" for="brushOpacity">
      Инт.
      <input id="brushOpacity" type="range" min="10" max="100" step="5" value="100" aria-label="Интенсивность кисти" />
      <span id="brushOpacityValue" class="size-value">100%</span>
    </label>
  </div>

  <div class="actions">
    <button id="undoButton" class="btn btn-gray" type="button" onclick="undo()" aria-label="Отменить последнее действие" disabled>↶</button>
    <button id="redoButton" class="btn btn-gray" type="button" onclick="redo()" aria-label="Повторить отменённое действие" disabled>↷</button>
    <button class="btn btn-gray" type="button" onclick="clearC()" aria-label="Очистить холст">🧹</button>
    <button class="btn btn-red" type="button" onclick="finish()" aria-label="Завершить рисунок">🏁</button>
  </div>
</div>

<script>
  // --- COLORS & TOOLS ---
  let currentColor = "#000000";
  let erasing = false;
  let brushSize = 6;
  let brushOpacity = 1;

  const eraserButton = document.getElementById("eraserButton");
  const brushSizeInput = document.getElementById("brushSize");
  const brushSizeValue = document.getElementById("brushSizeValue");
  const brushOpacityInput = document.getElementById("brushOpacity");
  const brushOpacityValue = document.getElementById("brushOpacityValue");

  function setEraser(active) {
    erasing = Boolean(active);
    eraserButton.classList.toggle("active", erasing);
    eraserButton.setAttribute("aria-pressed", erasing ? "true" : "false");
  }

  function setColor(c) {
    currentColor = c;
    setEraser(false);
    const swatches = document.querySelectorAll(".swatch");
    for (let i = 0; i < swatches.length; i++) {
      swatches[i].classList.remove("active");
    }
    const active = document.querySelector(`.swatch[data-c="${c}"]`);
    if (active) active.classList.add("active");
  }

  function getStrokeColor() {
    return erasing ? "#ffffff" : currentColor;
  }

  function normalizeOpacity(value) {
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) return 1;
    return Math.max(0.1, Math.min(1, numeric));
  }

  const paletteButtons = document.querySelectorAll(".swatch");
  for (let i = 0; i < paletteButtons.length; i++) {
    paletteButtons[i].addEventListener("click", function() {
      setColor(this.dataset.c);
    });
  }

  const colorPicker = document.getElementById("colorPicker");
  colorPicker.addEventListener("input", function() {
    setColor(this.value);
  });

  eraserButton.addEventListener("click", function() {
    setEraser(!erasing);
  });

  brushSizeInput.addEventListener("input", function() {
    const nextSize = Number(this.value);
    brushSize = Number.isFinite(nextSize) ? nextSize : 6;
    brushSizeValue.textContent = String(brushSize);
  });

  brushOpacityInput.addEventListener("input", function() {
    const percent = Number(this.value);
    const safePercent = Number.isFinite(percent) ? Math.max(10, Math.min(100, percent)) : 100;
    brushOpacity = safePercent / 100;
    brushOpacityValue.textContent = String(safePercent) + "%";
  });

  setColor("#000000");

  // --- TELEGRAM WEBAPP ---
  function getHashParam(name) {
    const hash = window.location.hash && window.location.hash.charAt(0) === "#"
      ? window.location.hash.slice(1)
      : window.location.hash;
    if (!hash) return "";
    try {
      return new URLSearchParams(hash).get(name) || "";
    } catch (e) {
      return "";
    }
  }

  const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    if (typeof tg.expand === "function") tg.expand();
    if (typeof tg.ready === "function") tg.ready();
  }

  const telegramInitData = (tg && tg.initData) || getHashParam("tgWebAppData") || "";
  let fallbackStartParam = "";
  if (telegramInitData) {
    try {
      fallbackStartParam = new URLSearchParams(telegramInitData).get("start_param") || "";
    } catch (e) {
      fallbackStartParam = "";
    }
  }
  const roomId = (
    tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param
      ? tg.initDataUnsafe.start_param
      : fallbackStartParam
  );

  function showTelegramAlert(message) {
    if (tg && typeof tg.showAlert === "function") {
      tg.showAlert(message);
    } else {
      window.alert(message);
    }
  }

  function showWordPopup(word) {
    const message = String(word || "").toUpperCase();
    if (tg && typeof tg.showPopup === "function") {
      tg.showPopup({ title: "Слово", message: message });
    } else {
      window.alert("Слово: " + message);
    }
  }

  function closeWebApp() {
    if (tg && typeof tg.close === "function") {
      tg.close();
    } else {
      window.close();
    }
  }

  // --- CANVAS ---
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: true });
  const undoButton = document.getElementById("undoButton");
  const redoButton = document.getElementById("redoButton");
  const HISTORY_LIMIT = 20;
  const MIN_CANVAS_ZOOM = 1;
  const MAX_CANVAS_ZOOM = 4;
  let undoStack = [];
  let redoStack = [];
  let isDirty = false;
  let canvasZoom = MIN_CANVAS_ZOOM;
  let canvasPanX = 0;
  let canvasPanY = 0;
  let pinchState = null;
  let touchGestureActive = false;
  const touchPointers = new Map();

  function applyStrokeStyle(width = brushSize) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = width;
  }

  function clampCanvasPan(x, y, scale = canvasZoom) {
    const width = canvas.offsetWidth || window.innerWidth || 1;
    const height = canvas.offsetHeight || canvas.height || 1;
    return {
      x: Math.min(0, Math.max(width - width * scale, x)),
      y: Math.min(0, Math.max(height - height * scale, y))
    };
  }

  function applyCanvasViewportTransform() {
    const clamped = clampCanvasPan(canvasPanX, canvasPanY, canvasZoom);
    canvasPanX = clamped.x;
    canvasPanY = clamped.y;
    canvas.style.transform = `translate(${canvasPanX}px, ${canvasPanY}px) scale(${canvasZoom})`;
  }

  function resetCanvasViewportTransform() {
    canvasZoom = MIN_CANVAS_ZOOM;
    canvasPanX = 0;
    canvasPanY = 0;
    pinchState = null;
    touchGestureActive = false;
    touchPointers.clear();
    applyCanvasViewportTransform();
  }

  function beginPinch(first, second) {
    const dx = second.clientX - first.clientX;
    const dy = second.clientY - first.clientY;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const centerX = (first.clientX + second.clientX) / 2;
    const centerY = (first.clientY + second.clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const baseLeft = rect.left - canvasPanX;
    const baseTop = rect.top - canvasPanY;

    pinchState = {
      startDistance: distance,
      startScale: canvasZoom,
      baseLeft: baseLeft,
      baseTop: baseTop,
      contentX: (centerX - rect.left) / canvasZoom,
      contentY: (centerY - rect.top) / canvasZoom
    };
  }

  function updatePinch(first, second) {
    if (!pinchState) return;
    const dx = second.clientX - first.clientX;
    const dy = second.clientY - first.clientY;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const centerX = (first.clientX + second.clientX) / 2;
    const centerY = (first.clientY + second.clientY) / 2;
    const nextZoom = Math.max(
      MIN_CANVAS_ZOOM,
      Math.min(MAX_CANVAS_ZOOM, pinchState.startScale * distance / pinchState.startDistance)
    );

    canvasZoom = nextZoom;
    canvasPanX = centerX - pinchState.baseLeft - pinchState.contentX * nextZoom;
    canvasPanY = centerY - pinchState.baseTop - pinchState.contentY * nextZoom;
    applyCanvasViewportTransform();
  }

  function beginPinchFromPointerMap() {
    if (touchPointers.size < 2) {
      pinchState = null;
      return;
    }
    const points = Array.from(touchPointers.values());
    beginPinch(points[0], points[1]);
  }

  function updatePinchFromPointerMap() {
    if (touchPointers.size < 2) return;
    const points = Array.from(touchPointers.values());
    updatePinch(points[0], points[1]);
  }

  function updateHistoryButtons() {
    undoButton.disabled = undoStack.length === 0;
    redoButton.disabled = redoStack.length === 0;
  }

  function captureCanvasState() {
    if (canvas.width < 1 || canvas.height < 1) return null;
    return {
      width: canvas.width,
      height: canvas.height,
      imageData: ctx.getImageData(0, 0, canvas.width, canvas.height)
    };
  }

  function trimHistory(stack) {
    if (stack.length > HISTORY_LIMIT) {
      stack.splice(0, stack.length - HISTORY_LIMIT);
    }
  }

  function pushUndoState() {
    const state = captureCanvasState();
    if (!state) return;
    undoStack.push(state);
    trimHistory(undoStack);
    redoStack = [];
    updateHistoryButtons();
  }

  function resetHistory() {
    undoStack = [];
    redoStack = [];
    updateHistoryButtons();
  }

  function restoreCanvasState(state) {
    if (!state || state.width !== canvas.width || state.height !== canvas.height) {
      resetHistory();
      return false;
    }
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.putImageData(state.imageData, 0, 0);
    ctx.restore();
    isDirty = true;
    sendSnap(true);
    return true;
  }

  function resize() {
    const toolbarH = document.querySelector(".toolbar").offsetHeight;

    const tmp = document.createElement("canvas");
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    if (canvas.width > 0) {
      const tmpCtx = tmp.getContext("2d");
      tmpCtx.drawImage(canvas, 0, 0);
    }

    canvas.width = window.innerWidth;
    const targetH = Math.floor(canvas.width * 1.25);
    const maxH = window.innerHeight - toolbarH;
    canvas.height = Math.max(1, Math.min(targetH, maxH));

    applyStrokeStyle();
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (tmp.width > 0) {
      ctx.drawImage(tmp, 0, 0);
    }
    resetCanvasViewportTransform();
    resetHistory();
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 100));
  setTimeout(resize, 100);

  // --- PREVIEW COMPRESSION ---
  const pCanvas = document.createElement("canvas");
  const pCtx = pCanvas.getContext("2d", { alpha: false });

  function getCompressedJpeg() {
    const TARGET_W = 420;
    const scale = Math.min(1, TARGET_W / canvas.width);

    pCanvas.width = Math.max(1, Math.floor(canvas.width * scale));
    pCanvas.height = Math.max(1, Math.floor(canvas.height * scale));

    pCtx.fillStyle = "#fff";
    pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
    pCtx.drawImage(canvas, 0, 0, pCanvas.width, pCanvas.height);

    return pCanvas.toDataURL("image/jpeg", 0.65);
  }

  // --- SOCKET ---
  // Start with HTTP polling and upgrade to WebSocket when the Telegram WebView/network
  // supports it. WebSocket-only mode was flaky on some mobile launches.
  const socket = io({
    auth: { initData: telegramInitData },
    transports: ["polling", "websocket"],
    upgrade: true,
    rememberUpgrade: false,
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 500,
    reconnectionDelayMax: 3000,
    timeout: 10000
  });

  socket.on("connect", () => {
    console.log("Socket connected via", socket.io.engine.transport.name);
    socket.emit("join_room", { room: roomId }, (response) => {
      if (!response || !response.ok) {
        console.error("Room authorization failed");
        showTelegramAlert("Этот холст доступен только текущему художнику.");
        socket.disconnect();
        return;
      }
      // Publish the actual local canvas after every reconnect. This also repairs
      // a preview that stayed blank while the connection was unavailable.
      isDirty = true;
      sendSnap(true);
    });
  });

  socket.on("disconnect", () => {
    console.log("Socket disconnected");
    if (snapTimeout) clearTimeout(snapTimeout);
    snapTimeout = null;
    snapInFlight = false;
    // Never lose a pending drawing because the transport disappeared mid-snapshot.
    isDirty = true;
  });

  socket.on("connect_error", (err) => {
    console.error("Socket error:", err.message);
  });

  function drawLine(from, to, color, width, opacity = 1) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = normalizeOpacity(opacity);
    applyStrokeStyle(width);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.restore();
  }

  socket.on("draw_data", (d) => {
    drawLine(
      { x: d.px, y: d.py },
      { x: d.x, y: d.y },
      d.color || "#000000",
      Number(d.width) || 6,
      normalizeOpacity(d.opacity)
    );
  });

  socket.on("new_word_data", (d) => {
    showWordPopup(d.word);
    clearCanvas(false);
    resetHistory();
  });

  // --- SNAPSHOT ---
  let snapInFlight = false;
  let snapCount = 0;
  let snapTimeout = null;

  function sendSnap(force = false) {
    if (!socket.connected) {
      console.log("Skip snap: no socket");
      return;
    }
    if (snapInFlight) {
      console.log("Skip snap: in flight");
      return;
    }
    if (!force && !isDirty) {
      return;
    }

    snapInFlight = true;
    const data = getCompressedJpeg();
    snapCount++;
    console.log("Sending snap #" + snapCount);

    // Mark only this exact bitmap as submitted. New strokes made while the
    // request is in flight set isDirty=true again and are preserved.
    isDirty = false;

    if (snapTimeout) clearTimeout(snapTimeout);
    snapTimeout = setTimeout(() => {
      console.warn("Snap timeout - forcing retry");
      snapInFlight = false;
      isDirty = true;
    }, 5000);

    socket.emit("snapshot", { room: roomId, image: data }, (response) => {
      clearTimeout(snapTimeout);
      snapTimeout = null;
      snapInFlight = false;
      console.log("Snap response:", response);
      if (response !== "OK") {
        // Throttling, a temporary transport failure or a server-side error must
        // not permanently mark the latest drawing as already published.
        isDirty = true;
      }
    });
  }

  // --- DRAWING ---
  let drawing = false;
  let activePointerId = null;
  let strokeChanged = false;
  let last = { x: 0, y: 0 };

  function getPosFromClient(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    const scaleX = r.width > 0 ? canvas.width / r.width : 1;
    const scaleY = r.height > 0 ? canvas.height / r.height : 1;

    return {
      x: (clientX - r.left) * scaleX,
      y: (clientY - r.top) * scaleY
    };
  }

  function beginStroke(clientX, clientY) {
    drawing = true;
    strokeChanged = false;
    last = getPosFromClient(clientX, clientY);
  }

  function continueStroke(clientX, clientY) {
    if (!drawing) return;
    const p = getPosFromClient(clientX, clientY);
    const color = getStrokeColor();
    if (!strokeChanged) {
      pushUndoState();
      strokeChanged = true;
    }
    drawLine(last, p, color, brushSize, brushOpacity);
    if (socket.connected) {
      emitDrawStep(last, p, color, brushSize, brushOpacity);
    }
    isDirty = true;
    last = p;
  }

  function endStroke() {
    if (!drawing) return;
    drawing = false;
    strokeChanged = false;
    activePointerId = null;
    sendSnap(false);
  }

  function emitDrawStep(from, to, color, width, opacity) {
    socket.emit("draw_step", {
      room: roomId,
      px: from.x,
      py: from.y,
      x: to.x,
      y: to.y,
      color: color,
      width: width,
      opacity: opacity
    });
  }

  function capturePointerSafely(e) {
    if (typeof canvas.setPointerCapture !== "function") return;
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (_err) {
      // Some Telegram WebViews expose Pointer Events but only partial capture.
    }
  }

  if (typeof window.PointerEvent === "function") {
    canvas.addEventListener("pointerdown", function(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();

      if (e.pointerType === "touch") {
        touchPointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
        capturePointerSafely(e);

        if (touchGestureActive || touchPointers.size >= 2) {
          if (!touchGestureActive && drawing) endStroke();
          touchGestureActive = true;
          if (touchPointers.size === 2 || !pinchState) beginPinchFromPointerMap();
          return;
        }
      }

      activePointerId = e.pointerId;
      beginStroke(e.clientX, e.clientY);
      capturePointerSafely(e);
    });

    canvas.addEventListener("pointermove", function(e) {
      if (e.pointerType === "touch" && touchPointers.has(e.pointerId)) {
        touchPointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
        if (touchGestureActive) {
          e.preventDefault();
          updatePinchFromPointerMap();
          return;
        }
      }
      if (!drawing || e.pointerId !== activePointerId) return;
      e.preventDefault();
      continueStroke(e.clientX, e.clientY);
    });

    function finishPointerStroke(e) {
      if (e.pointerType === "touch" && touchPointers.has(e.pointerId)) {
        const wasGesture = touchGestureActive;
        touchPointers.delete(e.pointerId);
        if (wasGesture) {
          e.preventDefault();
          if (touchPointers.size >= 2) {
            beginPinchFromPointerMap();
          } else {
            pinchState = null;
          }
          if (touchPointers.size === 0) touchGestureActive = false;
          return;
        }
      }
      if (!drawing || e.pointerId !== activePointerId) return;
      e.preventDefault();
      endStroke();
    }

    canvas.addEventListener("pointerup", finishPointerStroke);
    canvas.addEventListener("pointercancel", finishPointerStroke);
    canvas.addEventListener("lostpointercapture", function(e) {
      if (e.pointerType === "touch" && touchPointers.has(e.pointerId)) {
        touchPointers.delete(e.pointerId);
        if (touchGestureActive) {
          if (touchPointers.size >= 2) {
            beginPinchFromPointerMap();
          } else {
            pinchState = null;
          }
          if (touchPointers.size === 0) touchGestureActive = false;
          return;
        }
      }
      if (drawing && e.pointerId === activePointerId) endStroke();
    });
    // If pointer capture is unavailable, releasing a finger/mouse outside the
    // canvas still has to finish the current stroke.
    window.addEventListener("pointerup", finishPointerStroke);
    window.addEventListener("pointercancel", finishPointerStroke);
  } else {
    // Fallback for older/embedded Telegram WebViews without reliable Pointer Events.
    canvas.addEventListener("touchstart", function(e) {
      if (!e.touches.length) return;
      e.preventDefault();

      if (touchGestureActive || e.touches.length >= 2) {
        if (!touchGestureActive && drawing) endStroke();
        touchGestureActive = true;
        if (e.touches.length >= 2) beginPinch(e.touches[0], e.touches[1]);
        return;
      }

      const t = e.touches[0];
      beginStroke(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener("touchmove", function(e) {
      if (touchGestureActive) {
        e.preventDefault();
        if (e.touches.length >= 2) updatePinch(e.touches[0], e.touches[1]);
        return;
      }
      if (!drawing || !e.touches.length) return;
      e.preventDefault();
      const t = e.touches[0];
      continueStroke(t.clientX, t.clientY);
    }, { passive: false });

    function finishFallbackTouch(e) {
      e.preventDefault();
      if (touchGestureActive) {
        if (e.touches.length >= 2) {
          beginPinch(e.touches[0], e.touches[1]);
        } else {
          pinchState = null;
        }
        if (e.touches.length === 0) touchGestureActive = false;
        return;
      }
      endStroke();
    }

    canvas.addEventListener("touchend", finishFallbackTouch, { passive: false });
    canvas.addEventListener("touchcancel", finishFallbackTouch, { passive: false });

    canvas.addEventListener("mousedown", function(e) {
      if (e.button !== 0) return;
      e.preventDefault();
      beginStroke(e.clientX, e.clientY);
    });
    window.addEventListener("mousemove", function(e) {
      if (!drawing) return;
      continueStroke(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", function() {
      endStroke();
    });
  }

  // --- BUTTONS ---
  function clearCanvas(recordHistory = true) {
    if (recordHistory) pushUndoState();
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
    isDirty = true;
    sendSnap(true);
  }

  window.undo = () => {
    if (drawing || undoStack.length === 0) return;
    const current = captureCanvasState();
    const previous = undoStack.pop();
    if (current) {
      redoStack.push(current);
      trimHistory(redoStack);
    }
    if (!restoreCanvasState(previous)) return;
    updateHistoryButtons();
  };

  window.redo = () => {
    if (drawing || redoStack.length === 0) return;
    const current = captureCanvasState();
    const next = redoStack.pop();
    if (current) {
      undoStack.push(current);
      trimHistory(undoStack);
    }
    if (!restoreCanvasState(next)) return;
    updateHistoryButtons();
  };

  window.clearC = () => {
    clearCanvas(true);
  };

  window.finish = () => {
    const img = canvas.toDataURL("image/jpeg", 0.85);
    socket.emit("final_frame", { room: roomId, image: img });
    setTimeout(closeWebApp, 500);
  };

  updateHistoryButtons();
  setInterval(() => sendSnap(false), 2500);

  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("gesturechange", e => e.preventDefault());
  document.addEventListener("gestureend", e => e.preventDefault());
</script>

</body>
</html>
