<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crocodile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      background: #222;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: fixed;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      flex: 1;
      background: #fff;
      display: block;
      touch-action: none;
      width: 100%;
      height: auto;
    }
    .toolbar {
      min-height: 78px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      touch-action: auto;
    }
    .btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      color: white;
      cursor: pointer;
      white-space: nowrap;
      touch-action: auto;
    }
    .btn-blue { background: #007aff; }
    .btn-red { background: #ff3b30; }
    .btn-gray { background: #555; }

    .palette {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1 1 360px;
      min-width: 0;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.6);
      box-sizing: border-box;
      padding: 0;
      touch-action: auto;
      flex: 0 0 auto;
    }
    .swatch.active {
      border: 2px solid #fff;
      outline: 2px solid rgba(0,0,0,0.35);
    }
    .picker {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      padding: 0;
      background: transparent;
      touch-action: auto;
      flex: 0 0 auto;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-left: auto;
      flex: 0 0 auto;
    }
    @media (max-width: 520px) {
      .palette {
        flex-basis: 100%;
      }
      .actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar" class="toolbar">
  <div class="palette" id="palette">
    <button class="swatch active" type="button" data-c="#000000" style="background:#000000" aria-label="Чёрный"></button>
    <button class="swatch" type="button" data-c="#ffffff" style="background:#ffffff" aria-label="Белый"></button>
    <button class="swatch" type="button" data-c="#ff3b30" style="background:#ff3b30" aria-label="Красный"></button>
    <button class="swatch" type="button" data-c="#ff9500" style="background:#ff9500" aria-label="Оранжевый"></button>
    <button class="swatch" type="button" data-c="#ffcc00" style="background:#ffcc00" aria-label="Жёлтый"></button>
    <button class="swatch" type="button" data-c="#34c759" style="background:#34c759" aria-label="Зелёный"></button>
    <button class="swatch" type="button" data-c="#007aff" style="background:#007aff" aria-label="Синий"></button>
    <button class="swatch" type="button" data-c="#5856d6" style="background:#5856d6" aria-label="Индиго"></button>
    <button class="swatch" type="button" data-c="#af52de" style="background:#af52de" aria-label="Фиолетовый"></button>
    <button class="swatch" type="button" data-c="#00c7be" style="background:#00c7be" aria-label="Бирюзовый"></button>
    <button class="swatch" type="button" data-c="#64d2ff" style="background:#64d2ff" aria-label="Голубой"></button>
    <button class="swatch" type="button" data-c="#8e8e93" style="background:#8e8e93" aria-label="Серый"></button>
    <button class="swatch" type="button" data-c="#a2845e" style="background:#a2845e" aria-label="Коричневый"></button>
    <button class="swatch" type="button" data-c="#ff2d55" style="background:#ff2d55" aria-label="Розовый"></button>
    <input id="colorPicker" type="color" class="picker" value="#000000" aria-label="Другой цвет" />
  </div>

  <div class="actions">
    <button class="btn btn-gray" onclick="clearC()">🧹</button>
    <button class="btn btn-blue" onclick="skip()">🔄</button>
    <button class="btn btn-red" onclick="finish()">🏁</button>
  </div>
</div>

<script>
  // --- COLORS ---
  // Палитра уже присутствует в HTML: она остаётся видимой даже если конкретный
  // Telegram WebView не загрузил telegram-web-app.js или имеет неполный WebApp API.
  let currentColor = "#000000";

  function setColor(c) {
    currentColor = c;
    const swatches = document.querySelectorAll(".swatch");
    for (let i = 0; i < swatches.length; i++) {
      swatches[i].classList.remove("active");
    }
    const active = document.querySelector(`.swatch[data-c="${c}"]`);
    if (active) active.classList.add("active");
  }

  const paletteButtons = document.querySelectorAll(".swatch");
  for (let i = 0; i < paletteButtons.length; i++) {
    paletteButtons[i].addEventListener("click", function() {
      setColor(this.dataset.c);
    });
  }

  const colorPicker = document.getElementById("colorPicker");
  colorPicker.addEventListener("input", function() {
    setColor(this.value);
  });
  setColor("#000000");

  // --- TELEGRAM WEBAPP ---
  function getHashParam(name) {
    const hash = window.location.hash && window.location.hash.charAt(0) === "#"
      ? window.location.hash.slice(1)
      : window.location.hash;
    if (!hash) return "";
    try {
      return new URLSearchParams(hash).get(name) || "";
    } catch (e) {
      return "";
    }
  }

  const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    if (typeof tg.expand === "function") tg.expand();
    if (typeof tg.ready === "function") tg.ready();
  }

  const telegramInitData = (tg && tg.initData) || getHashParam("tgWebAppData") || "";
  let fallbackStartParam = "";
  if (telegramInitData) {
    try {
      fallbackStartParam = new URLSearchParams(telegramInitData).get("start_param") || "";
    } catch (e) {
      fallbackStartParam = "";
    }
  }
  const roomId = (
    tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param
      ? tg.initDataUnsafe.start_param
      : fallbackStartParam
  );

  function showTelegramAlert(message) {
    if (tg && typeof tg.showAlert === "function") {
      tg.showAlert(message);
    } else {
      window.alert(message);
    }
  }

  function showWordPopup(word) {
    const message = String(word || "").toUpperCase();
    if (tg && typeof tg.showPopup === "function") {
      tg.showPopup({ title: "Слово", message: message });
    } else {
      window.alert("Слово: " + message);
    }
  }

  function closeWebApp() {
    if (tg && typeof tg.close === "function") {
      tg.close();
    } else {
      window.close();
    }
  }

  // --- CANVAS ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
  let isDirty = false;

  function resize() {
    const toolbarH = document.querySelector('.toolbar').offsetHeight;

    const tmp = document.createElement('canvas');
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    if (canvas.width > 0) {
      const tmpCtx = tmp.getContext('2d');
      tmpCtx.drawImage(canvas, 0, 0);
    }

    canvas.width = window.innerWidth;
    const targetH = Math.floor(canvas.width * 1.25);
    const maxH = window.innerHeight - toolbarH;
    canvas.height = Math.min(targetH, maxH);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 6;

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (tmp.width > 0) {
      ctx.drawImage(tmp, 0, 0);
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));
  setTimeout(resize, 100);

  // --- PREVIEW COMPRESSION ---
  const pCanvas = document.createElement('canvas');
  const pCtx = pCanvas.getContext('2d', { alpha: false });

  function getCompressedJpeg() {
    const TARGET_W = 420;
    const scale = Math.min(1, TARGET_W / canvas.width);

    pCanvas.width = Math.max(1, Math.floor(canvas.width * scale));
    pCanvas.height = Math.max(1, Math.floor(canvas.height * scale));

    pCtx.fillStyle = '#fff';
    pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
    pCtx.drawImage(canvas, 0, 0, pCanvas.width, pCanvas.height);

    return pCanvas.toDataURL('image/jpeg', 0.65);
  }

  // --- SOCKET ---
  const socket = io({
    auth: { initData: telegramInitData },
    transports: ['websocket'],
    upgrade: false,
    reconnection: true,
    timeout: 10000
  });

  socket.on('connect', () => {
    console.log('Socket connected');
    socket.emit('join_room', { room: roomId }, (response) => {
      if (!response || !response.ok) {
        console.error('Room authorization failed');
        showTelegramAlert('Этот холст доступен только текущему художнику.');
        socket.disconnect();
        return;
      }
      isDirty = true;
      sendSnap(true);
    });
  });

  socket.on('disconnect', () => {
    console.log('Socket disconnected');
  });

  socket.on('connect_error', (err) => {
    console.error('Socket error:', err.message);
  });

  socket.on('draw_data', (d) => {
    ctx.strokeStyle = d.color;
    ctx.beginPath();
    ctx.moveTo(d.px, d.py);
    ctx.lineTo(d.x, d.y);
    ctx.stroke();
  });

  socket.on('new_word_data', (d) => {
    showWordPopup(d.word);
    clearC();
  });

  // --- SNAPSHOT (ИСПРАВЛЕНО) ---
  let snapInFlight = false;
  let snapCount = 0;
  let snapTimeout = null;

  function sendSnap(force = false) {
    if (!socket.connected) {
      console.log('Skip snap: no socket');
      return;
    }
    if (snapInFlight) {
      console.log('Skip snap: in flight');
      return;
    }
    if (!force && !isDirty) {
      return;
    }

    snapInFlight = true;
    const data = getCompressedJpeg();
    snapCount++;

    console.log('Sending snap #' + snapCount);

    // Таймаут на случай, если сервер не ответит
    if (snapTimeout) clearTimeout(snapTimeout);
    snapTimeout = setTimeout(() => {
      console.warn('Snap timeout - forcing unlock');
      snapInFlight = false;
    }, 5000);

    // ИСПРАВЛЕНО: используем правильный формат callback для socket.io
    socket.emit('snapshot', { room: roomId, image: data }, (response) => {
      clearTimeout(snapTimeout);
      snapInFlight = false;
      console.log('Snap response:', response);
    });

    isDirty = false;
  }

  // --- DRAWING ---
  let drawing = false;
  let last = { x: 0, y: 0 };
  let strokeCount = 0;

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    let clientX, clientY;
    
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    
    return {
      x: clientX - r.left,
      y: clientY - r.top
    };
  }

  function drawLine(from, to, color) {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  // Touch события для мобильных
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    drawing = true;
    last = getPos(e);
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!drawing) return;

    const p = getPos(e);
    drawLine(last, p, currentColor);

    strokeCount++;
    
    socket.emit('draw_step', { 
      room: roomId, 
      px: last.x, 
      py: last.y,
      x: p.x,
      y: p.y,
      color: currentColor 
    });

    isDirty = true;
    last = p;
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!drawing) return;
    drawing = false;
    sendSnap(false);
  }, { passive: false });

  canvas.addEventListener('touchcancel', function(e) {
    e.preventDefault();
    drawing = false;
  }, { passive: false });

  // Mouse события для десктопа
  canvas.addEventListener('mousedown', function(e) {
    if (e.pointerType === 'touch') return;
    drawing = true;
    last = getPos(e);
  });

  canvas.addEventListener('mousemove', function(e) {
    if (e.pointerType === 'touch') return;
    if (!drawing) return;
    e.preventDefault();

    const p = getPos(e);
    drawLine(last, p, currentColor);

    socket.emit('draw_step', { 
      room: roomId, 
      px: last.x,
      py: last.y,
      x: p.x,
      y: p.y,
      color: currentColor 
    });

    isDirty = true;
    last = p;
  });

  canvas.addEventListener('mouseup', function(e) {
    if (e.pointerType === 'touch') return;
    if (!drawing) return;
    drawing = false;
    sendSnap(false);
  });

  // --- BUTTONS ---
  window.clearC = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    isDirty = true;
    sendSnap(true);
  };

  window.skip = () => {
    socket.emit('skip_turn', { room: roomId });
  };

  window.finish = () => {
    const img = canvas.toDataURL('image/jpeg', 0.85);
    socket.emit('final_frame', { room: roomId, image: img });
    setTimeout(closeWebApp, 500);
  };

  // авто-снап раз в 2.5 сек
  setInterval(() => sendSnap(false), 2500);

  // Предотвращаем зум и прокрутку
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
</script>

</body>
</html>
